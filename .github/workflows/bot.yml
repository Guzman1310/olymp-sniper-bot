name: Olymp Sniper Bot 24/7

on:
  schedule:
    # Corre automáticamente cada 5 minutos
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sniper-bot
  cancel-in-progress: true

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Corre hasta ~6 horas seguidas por sesión
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias
        run: |
          pip install -r requirements.txt || (cd olymp_sniper_bot && pip install -r requirements.txt)

      - name: Ejecutar Scanner Sniper 24/7
        run: |
          python cloud_runner.py
